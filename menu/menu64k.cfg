# ld65 config: 64 KiB output = file 0x70000-0x7FFFF of the 512 KiB ROM.
MEMORY {
    LOW: start = $0000, size = $8000, file = %O, fill = yes, fillval = $FF;
    B3C: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    B3D: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    B3E: start = $C000, size = $2000, file = %O, fill = yes, fillval = $FF;
    B3F: start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    LOWER32K: load = LOW, type = ro;
    BANK3C:   load = B3C, type = ro;
    BANK3D:   load = B3D, type = ro;
    BANK3E:   load = B3E, type = ro;
    BANK3F:   load = B3F, type = ro;
}
