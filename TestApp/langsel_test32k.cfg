# ld65 config: 32 KiB output = file 0x68000-0x6FFFF of the 512 KiB ROM.
MEMORY {
    B34: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    B35: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    B36: start = $C000, size = $2000, file = %O, fill = yes, fillval = $FF;
    B37: start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    BANK34: load = B34, type = ro;
    BANK35: load = B35, type = ro;
    BANK36: load = B36, type = ro;
    BANK37: load = B37, type = ro;
}
