# ld65 config: 64 KiB output = file 0x30000-0x3FFFF of the 512 KiB ROM.
MEMORY {
    LOW: start = $0000, size = $8000, file = %O, fill = yes, fillval = $FF;
    B1C: start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    B1D: start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    B1E: start = $C000, size = $2000, file = %O, fill = yes, fillval = $FF;
    B1F: start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    DATA18_1B: load = LOW, type = ro;
    BANK1C:   load = B1C, type = ro;
    BANK1D:   load = B1D, type = ro;
    BANK1E:   load = B1E, type = ro;
    BANK1F:   load = B1F, type = ro;
}
